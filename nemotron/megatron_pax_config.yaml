# Megatron-LM config for PAX-Coder on Snapkitty Nemotron 70B
# Ahmad Ali Parr · Bel Esprit D'Accord Irrevocable Trust
# Optimized for sovereign RTX cluster

model:
  type: nemotron
  nemotron_version: "70b-snapkitty"
  seq_length: 4096
  hidden_size: 8192
  num_layers: 80
  num_attention_heads: 64
  num_query_groups: 8          # GQA
  ffn_hidden_size: 28672
  normalization: "RMSNorm"
  position_embedding_type: "rope"
  rotary_base: 1000000
  rotary_percent: 1.0
  swiglu: true
  untie_embeddings_and_output_weights: true
  disable_bias_linear: true

deterministic:
  seed: 0xDEADBEEF
  data_seed: 0xDEADBEEF
  cuda_deterministic: true
  cudnn_deterministic: true
  cudnn_benchmark: false
  env_vars:
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    PYTHONHASHSEED: "3735928559"

parallelism:
  tensor_model_parallel_size: 4   # 4× RTX 3080
  pipeline_model_parallel_size: 2
  data_parallel_size: 1
  sequence_parallel: true
  distributed_optimizer: true

train:
  micro_batch_size: 1
  global_batch_size: 8
  lr: 1.0e-5
  min_lr: 1.0e-6
  lr_decay_style: "cosine"
  lr_warmup_steps: 100
  weight_decay: 0.01
  clip_grad: 1.0
  bf16: true
  fp16: false
  tf32: false                    # deterministic
  train_steps: 2000
  eval_interval: 100
  eval_iters: 10
  save_interval: 500

data:
  train_path: "build/pax_train.jsonl"
  val_path: "build/pax_val.jsonl"
  tokenizer: "Snapkitty/snapkitty-nemotron"
  format: "nemotron-chat"
  max_seq_len: 4096
  num_workers: 4

lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

custom_kernels:
  flash_attention: true
  fused_softmax: true
  fused_bias_gelu: true
  ptx_mma_sync: true
  cp_async: true

logging:
  wandb_project: "pax-coder-snapkitty"
  tensorboard_dir: "runs/pax-coder-snapkitty"
  bifrost_audit: true
  log_interval: 10
